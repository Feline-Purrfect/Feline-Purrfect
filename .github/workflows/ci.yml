# CI for every pull request into main and every commit that lands on main.
# Render deploys the backend only after these checks pass on main (render.yaml: autoDeployTrigger: checksPass).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces the old run; runs on main always finish (Render waits for them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # same as NODE_VERSION in render.yaml
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: npm run lint:syntax
      - name: Tests
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      # Bundles the app the way an EAS build does (Metro, Babel, NativeWind, Sentry), so a broken import,
      # a missing asset or a bad metro.config.js fails here instead of 20 minutes into an EAS build.
      - name: Bundle check (iOS + Android)
        run: npx expo export --platform ios --platform android --output-dir dist
        env:
          EXPO_NO_TELEMETRY: 1
          EXPO_PUBLIC_API_BASE_URL: https://example.invalid
          EXPO_PUBLIC_AUTH_API_URL: https://example.invalid
